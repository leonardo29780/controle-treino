<!DOCTYPE html>
<html>
<head>
    <title>Controle de Treinos</title>
    <style>
        body {
            font-family: Arial;
            background-color: #111;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

    <h1>⚽ Controle de Treinos</h1>

    <div class="card">
        <p>Projeto criado por Leonardo</p>
        <button onclick="alert('Em breve versão com sistema completo!')">
            Ver Sistema
        </button>
    </div>

</body>
</html>
